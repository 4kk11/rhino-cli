[config]
default_to_workspace = false

[tasks.default]
clear = true
description = "Run test and build."
alias = "check"

[tasks.check]
clear = true
description = "Run test and build."
dependencies = ["test", "build"]

[tasks.test]
clear = true
description = "Run Rust and C# tests."
dependencies = ["test-rust", "test-dotnet"]

[tasks.build]
clear = true
description = "Build Rust CLI, C# server/test runner, and RhinoCliPlugin."
dependencies = ["build-rust", "build-server", "build-test-runner", "build-plugin"]

[tasks.install-cli]
description = "Install rhino-cli from the current checkout."
command = "cargo"
args = ["install", "--path", "."]

[tasks.test-rust]
description = "Run Rust unit/integration tests serially."
command = "cargo"
args = ["test", "--", "--test-threads=1"]

[tasks.test-dotnet]
description = "Run C# server tests."
command = "dotnet"
args = ["test", "server/RhinoCli.Server.Tests/RhinoCli.Server.Tests.csproj"]

[tasks.build-rust]
description = "Build the Rust CLI."
command = "cargo"
args = ["build"]

[tasks.build-server]
description = "Build RhinoCli.Server."
command = "dotnet"
args = ["build", "server/RhinoCli.Server/RhinoCli.Server.csproj"]

[tasks.build-test-runner]
description = "Build RhinoCli.TestRunner."
command = "dotnet"
args = ["build", "server/RhinoCli.TestRunner/RhinoCli.TestRunner.csproj"]

[tasks.build-plugin]
description = "Build and install the bundled RhinoCliPlugin into Rhino's plugin directory."
command = "dotnet"
args = ["build", "plugin/RhinoCliPlugin/RhinoCliPlugin.csproj"]

[tasks.publish-dry-run]
description = "Run `cargo publish --dry-run` to verify the crate is ready for crates.io."
command = "cargo"
args = ["publish", "--dry-run"]

[tasks.yak-build]
description = "Build a Release .yak package for the bundled RhinoCliPlugin (macOS)."
script_runner = "@shell"
script = '''
set -euo pipefail
PLUGIN_DIR="plugin/RhinoCliPlugin"
OUT_DIR="${PLUGIN_DIR}/bin/Release/net7.0"
YAK_BIN="${YAK_BIN:-/Applications/Rhino 8.app/Contents/Resources/bin/yak}"

dotnet build "${PLUGIN_DIR}/RhinoCliPlugin.csproj" -c Release
cp "${PLUGIN_DIR}/manifest.yml" "${OUT_DIR}/"

cd "${OUT_DIR}"
"${YAK_BIN}" build --platform mac
ls -1 *.yak
'''

[tasks.yak-push]
description = "Push the .yak package built by `cargo make yak-build` to the Yak server. Requires `yak login` beforehand."
script_runner = "@shell"
script = '''
set -euo pipefail
OUT_DIR="plugin/RhinoCliPlugin/bin/Release/net7.0"
YAK_BIN="${YAK_BIN:-/Applications/Rhino 8.app/Contents/Resources/bin/yak}"

PKG=$(ls -1t "${OUT_DIR}"/*.yak 2>/dev/null | head -n 1)
if [ -z "${PKG}" ]; then
  echo "no .yak package found in ${OUT_DIR}; run \`cargo make yak-build\` first" >&2
  exit 1
fi
"${YAK_BIN}" push "${PKG}"
'''
